# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql,mail
# Or set spring.profiles.active=mysql,mail
#
# Fill these in (or export as environment variables before starting).
# For Gmail: use an App Password (Google Account → Security → 2-Step Verification → App passwords).

app.mail.enabled=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
