spring.application.name=loan-repayment-tracker
server.port=8080

# Use "mysql" for the assignment three-tier demo (requires MySQL).
# Use "h2" for a quick local run with no database install:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=h2

# Shared JWT settings
app.jwt.secret=loan-tracker-ucm-fall-2026-secret-key-change-in-prod
app.jwt.expiration-ms=604800000

# Email: off by default. Enable the "mail" profile and set MAIL_USERNAME / MAIL_PASSWORD.
# See application-mail.properties and backend/README.md
app.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

